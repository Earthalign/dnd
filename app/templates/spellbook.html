<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wirtualna Księga Zaklęć (Spellbook) | D&D 5e PL</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/spellbook.css">
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen">

<div class="container mx-auto px-4 py-8 max-w-7xl">
    <div class="no-print">
        <header class="text-center mb-8 border-b border-amber-600/20 pb-6">
            <h1 class="text-4xl md:text-5xl font-black text-amber-500 font-serif drop-shadow-[0_2px_10px_rgba(212,175,55,0.25)]">📖 Wirtualna Księga Zaklęć</h1>
            <p class="text-gray-400 mt-2 text-sm max-w-2xl mx-auto">Kompletna polska baza czarów D&D 5e dla każdego kręgu zaawansowania (0–9). Przeglądaj, filtruj, szukaj i drukuj gotowe karty czarów do PDF!</p>
            <div class="mt-4 flex justify-center gap-4">
                <a href="/" class="inline-flex items-center gap-2 text-amber-500 hover:text-amber-400 text-sm font-bold uppercase tracking-wider bg-amber-950/30 border border-amber-500/30 px-4 py-2 rounded-lg transition duration-200 hover:bg-amber-950/50">
                    &larr; Wróć do Kreatora Postaci
                </a>
            </div>
        </header>

        <!-- Filters Bar -->
        <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-6 mb-8 shadow-xl">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
                <!-- Class Filter -->
                <div class="md:col-span-4">
                    <label for="class-select" class="block text-xs uppercase tracking-wider text-gray-400 font-semibold mb-1">Klasa Czarująca</label>
                    <select id="class-select" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:border-amber-500 focus:ring-1 focus:ring-amber-500 focus:outline-none cursor-pointer" onchange="fetchSpells()">
                        <option value="all">Wszystkie klasy (Wszystkie czary)</option>
                        <option value="bard">Bard</option>
                        <option value="cleric">Kleryk (Cleric)</option>
                        <option value="druid">Druid</option>
                        <option value="paladin">Paladyn (Paladin)</option>
                        <option value="ranger">Łowca (Ranger)</option>
                        <option value="sorcerer">Zaklinacz (Sorcerer)</option>
                        <option value="warlock">Czarnoksiężnik (Warlock)</option>
                        <option value="wizard">Czarodziej / Mag (Wizard)</option>
                        <option value="artificer">Artificer</option>
                    </select>
                </div>

                <!-- Level Filter -->
                <div class="md:col-span-3">
                    <label for="level-select" class="block text-xs uppercase tracking-wider text-gray-400 font-semibold mb-1">Krąg Zaklęcia</label>
                    <select id="level-select" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:border-amber-500 focus:ring-1 focus:ring-amber-500 focus:outline-none cursor-pointer" onchange="fetchSpells()">
                        <option value="all">Wszystkie kręgi</option>
                        <option value="0">Sztuczka (Cantrip)</option>
                        <option value="1">1. Krąg (1st Level)</option>
                        <option value="2">2. Krąg (2nd Level)</option>
                        <option value="3">3. Krąg (3rd Level)</option>
                        <option value="4">4. Krąg (4th Level)</option>
                        <option value="5">5. Krąg (5th Level)</option>
                        <option value="6">6. Krąg (6th Level)</option>
                        <option value="7">7. Krąg (7th Level)</option>
                        <option value="8">8. Krąg (8th Level)</option>
                        <option value="9">9. Krąg (9th Level)</option>
                    </select>
                </div>

                <!-- Search Input -->
                <div class="md:col-span-3">
                    <label for="search-input" class="block text-xs uppercase tracking-wider text-gray-400 font-semibold mb-1">Szukaj czaru</label>
                    <div class="relative">
                        <input type="text" id="search-input" placeholder="Nazwa, szkoła, opis..." oninput="handleSearchDebounced()" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:border-amber-500 focus:ring-1 focus:ring-amber-500 focus:outline-none">
                        <button type="button" id="clear-search" onclick="clearSearch()" class="absolute right-3 top-3 text-gray-500 hover:text-white text-xs hidden">✕</button>
                    </div>
                </div>

                <!-- Print Button -->
                <div class="md:col-span-2">
                    <button onclick="window.print()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-[0_0_15px_rgba(16,185,129,0.3)] flex items-center justify-center gap-2 text-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                        Drukuj Karty (PDF)
                    </button>
                </div>
            </div>

            <!-- Stats Bar -->
            <div class="mt-4 pt-4 border-t border-gray-800/80 flex items-center justify-between text-xs text-gray-400">
                <div>
                    <span>Wyświetlane zaklęcia: </span>
                    <span id="spell-count" class="font-bold text-amber-400 font-mono">0</span>
                </div>
                <div class="flex gap-2 items-center">
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-gray-400">Lokalna baza polska (Spells CSV)</span>
                </div>
            </div>
        </div>

        <div id="loading" class="text-center text-amber-500 font-serif text-xl hidden my-12">
            Ładowanie zwojów zaklęć... ✨
        </div>
    </div>

    <!-- Print / Cards Container -->
    <div id="spell-container" class="spell-grid print-container">
        <!-- Cards injected dynamically here -->
    </div>
</div>

<script src="/static/js/spellbook.js"></script>

</body>
</html>
